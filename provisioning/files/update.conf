# Einstellungen für carvos-update (wird als Shell-Datei gelesen).
REPO=burkhardtnb5/carvos
ASSET=carvos-hub-arm64.tar.gz
# Öffentliche Schlüssel der Dev-PCs (kommen mit jedem Release, siehe provisioning/files/minisign.d/)
KEY_DIR=/etc/carvos/minisign.d
# Solange das Repo privat ist: Token mit Lesezugriff auf Inhalte in /etc/carvos/github-token (nur root).
TOKEN_FILE=/etc/carvos/github-token
DATA=/data
# So viele Versionen bleiben unter /data/releases liegen.
KEEP=3
HEALTH_SECONDS=30
